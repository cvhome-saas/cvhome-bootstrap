AWSTemplateFormatVersion: '2010-09-09'
Description: cvhome bootstrap

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - ProjectId
          - DomainZoneId
      - Label:
          default: Keycloak Configuration
        Parameters:
          - KeycloakAdminPassword
      - Label:
          default: Stripe Configuration
        Parameters:
          - StripeKey
          - StripeWebhockSigningKey
    ParameterLabels:
      ProjectId:
        default: Project ID
      DomainZoneId:
        default: Domain Zone Id
      KeycloakAdminPassword:
        default: Keycloak Admin Password
      StripeKey:
        default: Stripe API Key
      StripeWebhockSigningKey:
        default: Stripe Webhook Signing Key

Parameters:
  ProjectId:
    Type: String
    Description: Project ID.
    MinLength: 10
    MaxLength: 10

  DomainZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Select a Route53 hosted zone for the application. 

  StripeKey:
    Type: String
    Description: Stripe API key
    NoEcho: true
    Default: ''

  StripeWebhockSigningKey:
    Type: String
    Description: Stripe webhook signing key
    NoEcho: true
    Default: ''

  KeycloakAdminPassword:
    Type: String
    Description: Keycloak admin password for Keycloak sys-admin@mail.com
    NoEcho: true

Resources:
  StoreCoreGatewayRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectId}/store-core/store-core-gateway'
      EmptyOnDelete: true

  CoreAuthRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectId}/store-core/core-auth'
      EmptyOnDelete: true

  ManagerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectId}/store-core/manager'
      EmptyOnDelete: true

  SubscriptionRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectId}/store-core/subscription'
      EmptyOnDelete: true

  StoreUIRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectId}/store-core/store-ui'
      EmptyOnDelete: true

  WelcomeUIRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectId}/store-core/welcome-ui'
      EmptyOnDelete: true

  MerchantRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectId}/store-pod/merchant'
      EmptyOnDelete: true

  ContentRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectId}/store-pod/content'
      EmptyOnDelete: true

  CatalogRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectId}/store-pod/catalog'
      EmptyOnDelete: true

  OrderRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectId}/store-pod/order'
      EmptyOnDelete: true

  LandingUIRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectId}/store-pod/landing-ui'
      EmptyOnDelete: true

  MerchantUIRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectId}/store-pod/merchant-ui'
      EmptyOnDelete: true

  StorePodSaasGatewayRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectId}/store-pod/store-pod-saas-gateway'
      EmptyOnDelete: true


  DomainConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectId}/config/domain'
      Type: String
      Value: !Sub |
        {
          "domain": "${DomainZoneId}"
        }
      Description: Domain configuration for the application
  StripeConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectId}/config/stripe'
      Type: String
      Value: !Sub |
        {
          "stripeKey": "${StripeKey}",
          "stripeWebhockSigningKey": "${StripeWebhockSigningKey}"
        }
      Description: Stripe configuration including API key and webhook signing key
  KeycloakConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectId}/config/kc'
      Type: String
      Value: !Sub |
        {
          "username": "sys-admin@mail.com",
          "password": "${KeycloakAdminPassword}"
        }
      Description: Keycloak admin configuration

  TerraformStateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectId}-tf-state'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # CodeBuild Service Role
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectId}-codebuild-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt TerraformStateBucket.Arn
                  - !Sub '${TerraformStateBucket.Arn}/*'

  TerraformDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectId}-terraform-deployment-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: TerraformDeploymentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:*
                Resource: '*'
              
              # S3 - Terraform State and Application Buckets
              - Effect: Allow
                Action:
                  - s3:*
                Resource: '*'
              
              # ECR
              - Effect: Allow
                Action:
                  - ecr:*
                Resource: '*'
              
              # ECS
              - Effect: Allow
                Action:
                  - ecs:*
                  - ecs:CreateCluster
                  - ecs:CreateService
                  - ecs:UpdateService
                  - ecs:DeleteService
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListClusters
                  - ecs:ListServices
                  - ecs:ListTaskDefinitions
                Resource: '*'
              
              # RDS
              - Effect: Allow
                Action:
                  - rds:*
                Resource: '*'
              
              # CloudFront
              - Effect: Allow
                Action:
                  - cloudfront:*
                Resource: '*'
              
              # Route53
              - Effect: Allow
                Action:
                  - route53:*
                Resource: '*'
              
              # SSM Parameter Store
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                  - ssm:AddTagsToResource
                  - ssm:ListTagsForResource
                  - ssm:RemoveTagsFromResource
                  - ssm:DescribeParameters
                Resource: '*'
              
              # Secrets Manager
              - Effect: Allow
                Action:
                  - secretsmanager:*
                Resource: '*'
              
              # VPC and Networking
              - Effect: Allow
                Action:
                  - ec2:*
                Resource: '*'
              
              # Application Load Balancer / Network Load Balancer
              - Effect: Allow
                Action:
                  - elasticloadbalancing:*
                Resource: '*'
              
              # IAM (Limited to specific patterns)
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListPolicies
                  - iam:ListPolicyVersions
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:TagPolicy
                  - iam:UntagPolicy
                Resource: '*'
              
              # CloudWatch
              - Effect: Allow
                Action:
                  - cloudwatch:*
                Resource: '*'
              
              # Application Auto Scaling
              - Effect: Allow
                Action:
                  - application-autoscaling:*
                Resource: '*'
              
              # ACM (Certificate Manager)
              - Effect: Allow
                Action:
                  - acm:*
                Resource: '*'
              
              # KMS
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:DescribeKey
                  - kms:CreateGrant
                  - kms:ListAliases
                  - kms:ListKeys
                Resource: '*'
              
              # Service Discovery
              - Effect: Allow
                Action:
                  - servicediscovery:*
                Resource: '*'
              
              # ElastiCache
              - Effect: Allow
                Action:
                  - elasticache:*
                Resource: '*'

  CvhomeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectId}-cvhome-build'
      Description: Build cvhome application and push Docker image to ECR
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: PROJECT_ID
            Value: !Ref ProjectId
          - Name: REGISTRY
            Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectId}'
          - Name: JAVA_OPTS
            Value: '-Xmx8g -Xms2g'
          - Name: GRADLE_OPTS
            Value: '-Dorg.gradle.jvmargs="-Xmx8g -Xms2g -XX:MaxMetaspaceSize=1g"'
      Source:
        Type: GITHUB
        Location: https://github.com/cvhome-saas/cvhome.git
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                    java: corretto21
            pre_build:
              commands:
                - echo "Java version:"
                - java -version
                - echo "Logging in to Amazon ECR..."
                - export ECR_TOKEN=$(aws ecr get-login-password --region $AWS_REGION)
                - echo $ECR_TOKEN | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
                - echo "Build started on `date`"
                - echo "REGISTRY=$REGISTRY"
            build:
              commands:
                - echo "Building application with Gradle..."
                - chmod +x gradlew
                - ./gradlew clean build bootBuildImage --publishImage -x test -x check --no-daemon
            post_build:
              commands:
                - echo "Build completed on `date`"
                - echo "Pushing Docker images to ECR..."
                # Tag and push images to ECR repositories
                # Adjust image names based on your bootBuildImage configuration


  CvhomeInfraDeployProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectId}-cvhome-ecs-fargate-infra-deploy'
      Description: Deploy cvhome infrastructure using Terraform
      ServiceRole: !GetAtt TerraformDeploymentRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: PROJECT_ID
            Value: !Ref ProjectId
          - Name: IMAGE_TAG
            Value: "latest"
          - Name: TF_STATE_BUCKET
            Value: !Ref TerraformStateBucket
      Source:
        Type: GITHUB
        Location: https://github.com/cvhome-saas/cvhome-ecs-fargate-infra.git
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - echo "Installing Terraform..."
                - wget https://releases.hashicorp.com/terraform/1.6.6/terraform_1.6.6_linux_amd64.zip
                - unzip terraform_1.6.6_linux_amd64.zip
                - mv terraform /usr/local/bin/
                - terraform --version
            pre_build:
              commands:
                - echo "Initializing Terraform..."
                - terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=cvhome/terraform.tfstate" -backend-config="region=$AWS_REGION"
            build:
              commands:
                - echo "Planning Terraform changes..."
                - terraform plan -var="project=$PROJECT_ID" -var="image_tag=$IMAGE_TAG" -out=tfplan
                - echo "Applying Terraform changes..."
                - terraform apply -auto-approve tfplan
            post_build:
              commands:
                - echo "Terraform deployment completed on `date`"





  CvhomeInfraDestroyProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectId}-cvhome-ecs-fargate-infra-destroy'
      Description: Destroy cvhome infrastructure using Terraform
      ServiceRole: !GetAtt TerraformDeploymentRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: PROJECT_ID
            Value: !Ref ProjectId
          - Name: IMAGE_TAG
            Value: "latest"
          - Name: TF_STATE_BUCKET
            Value: !Ref TerraformStateBucket
      Source:
        Type: GITHUB
        Location: https://github.com/cvhome-saas/cvhome-ecs-fargate-infra.git
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - echo "Installing Terraform..."
                - wget https://releases.hashicorp.com/terraform/1.6.6/terraform_1.6.6_linux_amd64.zip
                - unzip terraform_1.6.6_linux_amd64.zip
                - mv terraform /usr/local/bin/
                - terraform --version
            pre_build:
              commands:
                - echo "Initializing Terraform..."
                - terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=cvhome/terraform.tfstate" -backend-config="region=$AWS_REGION"
            build:
              commands:
                - echo "Destroy Terraform env..."
                - terraform destroy  -var="project=$PROJECT_ID" -var="image_tag=$IMAGE_TAG" --auto-approve=true
            post_build:
              commands:
                - echo "Terraform Destroy completed on `date`"

Outputs:
  ProjectId:
    Description: Project ID
    Value: !Ref ProjectId
    Export:
      Name: !Sub '${AWS::StackName}-ProjectId'

  DomainZoneId:
    Description: Domain name for the application
    Value: !Ref DomainZoneId
    Export:
      Name: !Sub '${AWS::StackName}-DomainZoneId'
      
  TerraformStateBucketName:
    Description: S3 bucket for Terraform state
    Value: !Ref TerraformStateBucket
    Export:
      Name: !Sub '${AWS::StackName}-TfStateBucket'

  CvhomeBuildProject:
    Description: CodeBuild project for cvhome application
    Value: !Ref CvhomeBuildProject

  CvhomeInfraDeployProject:
    Description: CodeDeploy project for cvhome infrastructure
    Value: !Ref CvhomeInfraDeployProject

  CvhomeInfraDestroyProject:
    Description: CodeDestroy project for cvhome infrastructure
    Value: !Ref CvhomeInfraDestroyProject

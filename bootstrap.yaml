AWSTemplateFormatVersion: '2010-09-09'
Description: cvhome bootstrap

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project Configuration
        Parameters:
          - DomainZoneId
          - Branch
      - Label:
          default: Pod Configuration
        Parameters:
          - PodCount
          - PodSize
          - PodAutoScale
          - isProd
          - isMonitoring
          - allowTestStores
      - Label:
          default: Stripe Configuration
        Parameters:
          - StripeKey
          - StripeWebhookSigningKey
    ParameterLabels:
      DomainZoneId:
        default: Domain Zone Id
      Branch:
        default: Branch
      PodCount:
        default: Pod Count
      PodSize:
        default: Pod Size
      PodAutoScale:
        default: Pod Auto Scale
      StripeKey:
        default: Stripe API Key
      StripeWebhookSigningKey:
        default: Stripe Webhook Signing Key

Parameters:
  DomainZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Select a Route53 hosted zone for the application.
  
  PodCount:
    Type: Number
    Description: Number of pods to create
    Default: 1
    MinValue: 1
    MaxValue: 5
    ConstraintDescription: Must be a number between 1 and 5

  PodSize:
    Type: String
    Description: Size of the pod
    Default: small
    AllowedValues:
      - small
      - medium
      - large
      - x-large
    ConstraintDescription: Must be one of small, medium, large, or x-large
  PodAutoScale:
    Type: String
    Description: Enable or disable pod auto scaling
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  isProd:
    Type: String
    Description: is Dev or Production env
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    ConstraintDescription: Must be either true or false
  isMonitoring:
    Type: String
    Description: is monitoring enabled
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    ConstraintDescription: Must be either true or false
  allowTestStores:
    Type: String
    Description: allow test stores
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    ConstraintDescription: Must be either true or false

  Branch:
    Type: String
    Description: Branch name
    Default: 'develop'

  StripeKey:
    Type: String
    Description: Stripe API key
    NoEcho: true
    Default: ''

  StripeWebhookSigningKey:
    Type: String
    Description: Stripe webhook signing key
    NoEcho: true
    Default: ''

Resources:
  # Lambda execution role for generating random project ID
  GenerateProjectIdFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Lambda function to generate random project ID
  GenerateProjectIdFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt GenerateProjectIdFunctionRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import cfnresponse
          import json
          import random
          import string
          
          def handler(event, context):
              try:
                  print(f"Event: {json.dumps(event)}")
          
                  if event['RequestType'] == 'Delete':
                      # Return the same project ID on delete
                      project_id = event['PhysicalResourceId']
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {'ProjectId': project_id}, project_id)
                      return
          
                  if event['RequestType'] == 'Update':
                      # Return the same project ID on update to prevent recreation
                      project_id = event['PhysicalResourceId']
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {'ProjectId': project_id}, project_id)
                      return
          
                  # Generate random 10-character alphanumeric project ID (lowercase)
                  project_id = ''.join(random.choices(string.ascii_lowercase + string.digits, k=10))
          
                  response_data = {
                      'ProjectId': project_id
                  }
          
                  print(f"Generated Project ID: {project_id}")
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data, project_id)
          
              except Exception as e:
                  print(f"Error: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, str(e))

  # Custom resource to generate project ID
  GenerateProjectIdCustomResource:
    Type: Custom::GenerateProjectId
    Properties:
      ServiceToken: !GetAtt GenerateProjectIdFunction.Arn

  StoreCoreGatewayRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${GenerateProjectIdCustomResource.ProjectId}/store-core/store-core-gateway'
      EmptyOnDelete: true

  CoreAuthRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${GenerateProjectIdCustomResource.ProjectId}/store-core/core-auth'
      EmptyOnDelete: true

  ManagerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${GenerateProjectIdCustomResource.ProjectId}/store-core/manager'
      EmptyOnDelete: true

  SubscriptionRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${GenerateProjectIdCustomResource.ProjectId}/store-core/subscription'
      EmptyOnDelete: true

  StoreUIRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${GenerateProjectIdCustomResource.ProjectId}/store-core/store-ui'
      EmptyOnDelete: true

  WelcomeUIRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${GenerateProjectIdCustomResource.ProjectId}/store-core/welcome-ui'
      EmptyOnDelete: true

  MerchantRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${GenerateProjectIdCustomResource.ProjectId}/store-pod/merchant'
      EmptyOnDelete: true

  ContentRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${GenerateProjectIdCustomResource.ProjectId}/store-pod/content'
      EmptyOnDelete: true

  CatalogRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${GenerateProjectIdCustomResource.ProjectId}/store-pod/catalog'
      EmptyOnDelete: true

  OrderRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${GenerateProjectIdCustomResource.ProjectId}/store-pod/order'
      EmptyOnDelete: true

  LandingUIRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${GenerateProjectIdCustomResource.ProjectId}/store-pod/landing-ui'
      EmptyOnDelete: true

  StorePodSaasGatewayRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${GenerateProjectIdCustomResource.ProjectId}/store-pod/store-pod-saas-gateway'
      EmptyOnDelete: true

  # Lambda execution role for the custom resource
  GetHostedZoneFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${GenerateProjectIdCustomResource.ProjectId}-get-hosted-zone-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Route53ReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - route53:GetHostedZone
                Resource: '*'

  # Lambda function to get hosted zone details
  GetHostedZoneFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${GenerateProjectIdCustomResource.ProjectId}-get-hosted-zone'
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt GetHostedZoneFunctionRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import json
          
          def handler(event, context):
              try:
                  print(f"Event: {json.dumps(event)}")
          
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return
          
                  hosted_zone_id = event['ResourceProperties']['HostedZoneId']
          
                  route53 = boto3.client('route53')
                  response = route53.get_hosted_zone(Id=hosted_zone_id)
          
                  # Extract domain name and remove trailing dot
                  domain_name = response['HostedZone']['Name'].rstrip('.')
          
                  response_data = {
                      'DomainName': domain_name,
                      'HostedZoneId': hosted_zone_id
                  }
          
                  print(f"Domain name: {domain_name}")
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data)
          
              except Exception as e:
                  print(f"Error: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, str(e))


  # Get the hosted zone details to extract the domain name
  GetHostedZoneCustomResource:
    Type: Custom::GetHostedZone
    Properties:
      ServiceToken: !GetAtt GetHostedZoneFunction.Arn
      HostedZoneId: !Ref DomainZoneId

  # ACM Certificate for domain and wildcard subdomain
  DomainCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !GetAtt GetHostedZoneCustomResource.DomainName
      SubjectAlternativeNames:
        - !Sub '*.${GetHostedZoneCustomResource.DomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !GetAtt GetHostedZoneCustomResource.DomainName
          HostedZoneId: !Ref DomainZoneId
      Tags:
        - Key: Name
          Value: !Sub '${GenerateProjectIdCustomResource.ProjectId}-domain-certificate'
        - Key: Project
          Value: !GetAtt GenerateProjectIdCustomResource.ProjectId

  CvhomeConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${GenerateProjectIdCustomResource.ProjectId}/config/cvhome'
      Type: String
      Value: !Sub |
        {
          "hosted_zone_id": "${DomainZoneId}",
          "env": "dev",
          "image_tag": "latest",
          "pod_count": "${PodCount}",
          "pod_size": "${PodSize}",
          "pod_auto_scale": "${PodAutoScale}",
          "is_prod": "${isProd}",
          "is_monitoring": "${isMonitoring}",
          "allow_test_stores": "${allowTestStores}"
        }
      Description: Cvhome configuration for the application


  StripeConfigSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${GenerateProjectIdCustomResource.ProjectId}/config/stripe"
      Description: Stripe configuration including API key and webhook signing key
      SecretString: !Sub |
        {
          "STRIPE_KEY": "${StripeKey}",
          "STRIPE_WEBHOOK-SIGNING-KEY": "${StripeWebhookSigningKey}"
        }
  
  
  KeycloakConfigSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "/${GenerateProjectIdCustomResource.ProjectId}/config/kc"
      Description: Keycloak admin configuration
      GenerateSecretString:
        SecretStringTemplate: |
          {
            "KEYCLOAK_ADMIN": "sys-admin@mail.com"
          }
        GenerateStringKey: "KEYCLOAK_ADMIN_PASSWORD"
        PasswordLength: 20
        ExcludeCharacters: "\"@/\\"


  EmptyS3BucketFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3DeletePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource:
                  - !Sub 'arn:aws:s3:::${GenerateProjectIdCustomResource.ProjectId}-tf-state'
                  - !Sub 'arn:aws:s3:::${GenerateProjectIdCustomResource.ProjectId}-tf-state/*'

  # Lambda function to empty S3 bucket
  EmptyS3BucketFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt EmptyS3BucketFunctionRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import json
          
          def handler(event, context):
              try:
                  print(f"Event: {json.dumps(event)}")
          
                  if event['RequestType'] != 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return
          
                  bucket_name = event['ResourceProperties']['BucketName']
                  s3 = boto3.resource('s3')
                  bucket = s3.Bucket(bucket_name)
          
                  print(f"Emptying bucket: {bucket_name}")
          
                  # Delete all object versions and delete markers
                  bucket.object_versions.delete()
          
                  print(f"Bucket {bucket_name} emptied successfully")
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
          
              except Exception as e:
                  print(f"Error: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, str(e))

  # Custom resource to empty bucket before deletion
  EmptyTerraformStateBucket:
    Type: Custom::EmptyS3Bucket
    Properties:
      ServiceToken: !GetAtt EmptyS3BucketFunction.Arn
      BucketName: !Ref TerraformStateBucket

  TerraformStateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${GenerateProjectIdCustomResource.ProjectId}-tf-state'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
    DeletionPolicy: Delete
  
  # CodeBuild Service Role
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${GenerateProjectIdCustomResource.ProjectId}-codebuild-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt TerraformStateBucket.Arn
                  - !Sub '${TerraformStateBucket.Arn}/*'

  TerraformDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${GenerateProjectIdCustomResource.ProjectId}-terraform-deployment-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: TerraformDeploymentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:*
                Resource: '*'
              
              # S3 - Terraform State and Application Buckets
              - Effect: Allow
                Action:
                  - s3:*
                Resource: '*'
              
              # ECR
              - Effect: Allow
                Action:
                  - ecr:*
                Resource: '*'
              
              # ECS
              - Effect: Allow
                Action:
                  - ecs:*
                Resource: '*'
              
              # RDS
              - Effect: Allow
                Action:
                  - rds:*
                Resource: '*'
              
              # CloudFront
              - Effect: Allow
                Action:
                  - cloudfront:*
                Resource: '*'
              
              # Route53
              - Effect: Allow
                Action:
                  - route53:*
                Resource: '*'
              
              # SSM Parameter Store
              - Effect: Allow
                Action:
                  - ssm:*
                Resource: '*'
              
              # Secrets Manager
              - Effect: Allow
                Action:
                  - secretsmanager:*
                Resource: '*'
              
              # VPC and Networking
              - Effect: Allow
                Action:
                  - ec2:*
                Resource: '*'
              
              # Application Load Balancer / Network Load Balancer
              - Effect: Allow
                Action:
                  - elasticloadbalancing:*
                Resource: '*'
              
              # IAM (Limited to specific patterns)
              - Effect: Allow
                Action:
                  - iam:*
                Resource: '*'
              
              # CloudWatch
              - Effect: Allow
                Action:
                  - cloudwatch:*
                Resource: '*'
              
              # Application Auto Scaling
              - Effect: Allow
                Action:
                  - application-autoscaling:*
                Resource: '*'
              
              # ACM (Certificate Manager)
              - Effect: Allow
                Action:
                  - acm:*
                Resource: '*'
              
              # KMS
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:DescribeKey
                  - kms:CreateGrant
                  - kms:ListAliases
                  - kms:ListKeys
                Resource: '*'
              
              # Service Discovery
              - Effect: Allow
                Action:
                  - servicediscovery:*
                Resource: '*'
              
              # ElastiCache
              - Effect: Allow
                Action:
                  - elasticache:*
                Resource: '*'

  CvhomeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${GenerateProjectIdCustomResource.ProjectId}-cvhome-build'
      Description: Build cvhome application and push Docker image to ECR
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: PROJECT_ID
            Value: !GetAtt GenerateProjectIdCustomResource.ProjectId
          - Name: REGISTRY
            Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${GenerateProjectIdCustomResource.ProjectId}'
          - Name: JAVA_OPTS
            Value: '-Xmx10g -Xms2g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC'
          - Name: GRADLE_OPTS
            Value: >
              -Dorg.gradle.jvmargs="-Xmx10g -Xms2g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"
              -Dorg.gradle.daemon=false
              -Dorg.gradle.parallel=true
              -Dorg.gradle.configureondemand=true
              -Dorg.gradle.caching=true
              -Dorg.gradle.vfs.watch=true
      Source:
        Type: GITHUB
        Location: https://github.com/cvhome-saas/cvhome.git
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                    java: corretto21
            pre_build:
              commands:
                - echo "Java version:"
                - java -version
                - echo "Logging in to Amazon ECR..."
                - export ECR_TOKEN=$(aws ecr get-login-password --region $AWS_REGION)
                - echo $ECR_TOKEN | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
                - echo "Build started on `date`"
                - echo "REGISTRY=$REGISTRY"
            build:
              commands:
                - echo "Building application with Gradle..."
                - chmod +x gradlew
                - ./gradlew clean build bootBuildImage --publishImage -x test -x check --no-daemon --parallel --build-cache --configure-on-demand
            post_build:
              commands:
                - echo "Build completed on `date`"
                - echo "Pushing Docker images to ECR..."
                # Tag and push images to ECR repositories
                # Adjust image names based on your bootBuildImage configuration

      SourceVersion: !Ref Branch
  CvhomeInfraDeployProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${GenerateProjectIdCustomResource.ProjectId}-cvhome-infra-deploy'
      Description: Deploy cvhome infrastructure using Terraform
      ServiceRole: !GetAtt TerraformDeploymentRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: PROJECT_ID
            Value: !GetAtt GenerateProjectIdCustomResource.ProjectId
          - Name: IMAGE_TAG
            Value: "latest"
          - Name: TF_STATE_BUCKET
            Value: !Ref TerraformStateBucket
      Source:
        Type: GITHUB
        Location: https://github.com/cvhome-saas/cvhome-infra.git
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - echo "Installing Terraform..."
                - wget https://releases.hashicorp.com/terraform/1.13.4/terraform_1.13.4_linux_amd64.zip
                - unzip terraform_1.13.4_linux_amd64.zip
                - mv terraform /usr/local/bin/
                - terraform --version
            pre_build:
              commands:
                - echo "Initializing Terraform..."
                - terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=cvhome/terraform.tfstate" -backend-config="region=$AWS_REGION"
            build:
              commands:
                - echo "Planning Terraform changes..."
                - terraform plan -var="project=$PROJECT_ID" -var="region=$AWS_REGION" -out=tfplan
                - echo "Applying Terraform changes..."
                - terraform apply -auto-approve tfplan
            post_build:
              commands:
                - echo "Terraform deployment completed on `date`"

  CvhomeInfraDestroyProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${GenerateProjectIdCustomResource.ProjectId}-cvhome-infra-destroy'
      Description: Destroy cvhome infrastructure using Terraform
      ServiceRole: !GetAtt TerraformDeploymentRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: PROJECT_ID
            Value: !GetAtt GenerateProjectIdCustomResource.ProjectId
          - Name: IMAGE_TAG
            Value: "latest"
          - Name: TF_STATE_BUCKET
            Value: !Ref TerraformStateBucket
      Source:
        Type: GITHUB
        Location: https://github.com/cvhome-saas/cvhome-infra.git
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - echo "Installing Terraform..."
                - wget https://releases.hashicorp.com/terraform/1.13.4/terraform_1.13.4_linux_amd64.zip
                - unzip terraform_1.13.4_linux_amd64.zip
                - mv terraform /usr/local/bin/
                - terraform --version
            pre_build:
              commands:
                - echo "Initializing Terraform..."
                - terraform init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=cvhome/terraform.tfstate" -backend-config="region=$AWS_REGION"
            build:
              commands:
                - echo "Destroy Terraform env..."
                - terraform destroy -var="project=$PROJECT_ID" -var="region=$AWS_REGION" --auto-approve=true
            post_build:
              commands:
                - echo "Terraform Destroy completed on `date`"

Outputs:
  ProjectId:
    Description: Generated Project ID
    Value: !GetAtt GenerateProjectIdCustomResource.ProjectId
    Export:
      Name: !Sub '${AWS::StackName}-ProjectId'